
<nav>
  @if (sesion(); as usuarioActual) {
    <a routerLink="/procesos">Procesos</a>
    @if (usuarioActual.rolUsuario === 'ADMIN') {
      <a routerLink="/usuarios">Usuarios</a>
      <a routerLink="/configuracion/permisos-pool">Permisos de pools</a>
      <a routerLink="/roles-proceso">Roles de proceso</a>
    }
    <span>{{ usuarioActual.nombre }} · {{ usuarioActual.empresaNombre }}</span>
    <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
  } @else {
    <a routerLink="/login">Ingresar</a>
    <a routerLink="/empresas/nueva">Registrar empresa</a>
  }
</nav>

<div class="contenido-ruta">
  <router-outlet />
</div>
