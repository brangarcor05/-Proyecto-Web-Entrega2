<div class="form-container">
    <h2>{{ isEditMode ? 'Editar Mensaje de Envío' : 'Nuevo Mensaje de Envío' }}</h2>

    <form [formGroup]="formulario" (ngSubmit)="guardar()">
        <label>
            Nombre del Mensaje (*):
            <input type="text" formControlName="nombreMensaje" placeholder="Ej. Enviar Factura" />
        </label>
        @if (formulario.get('nombreMensaje')?.invalid && formulario.get('nombreMensaje')?.touched) {
            <span class="error">El nombre es obligatorio y debe tener al menos 3 caracteres.</span>
        }

        <label>
            Clave de Correlación:
            <input type="text" formControlName="claveCorrelacion" placeholder="Ej. factura-123" />
        </label>

        <label>
            Pool Origen (*):
            <select formControlName="poolId">
                <option [ngValue]="null">-- Selecciona un Pool --</option>
                @for (pool of pools(); track pool.id) {
                    <option [value]="pool.id">{{ pool.nombre }}</option>
                }
            </select>
        </label>

        <label>
            Lane(*):
            <select formControlName="laneId">
                <option [ngValue]="null">-- Selecciona un Lane --</option>
                @for (lane of lanes(); track lane.id) {
                    <option [value]="lane.id">{{ lane.rolProcesoNombre }}</option>
                }
            </select>
        </label>

        <label>
            Pool Destino (*):
            <select formControlName="poolDestinoId">
                <option [ngValue]="null">-- Selecciona el Pool de Destino --</option>
                @for (pool of pools(); track pool.id) {
                    <option [value]="pool.id">{{ pool.nombre }}</option>
                }
            </select>
        </label>

        <div class="acciones">
            <button type="submit" [disabled]="formulario.invalid">Guardar</button>
            <button type="button" (click)="volverAlListado()">Cancelar</button>
        </div>
    </form>
</div>
