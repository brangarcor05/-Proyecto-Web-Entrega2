<div class="contenedor-vista">
    <header class="cabecera-seccion">
        <h2>Gestión de Actividades</h2>
        <button class="boton boton--primario" (click)="irANueva()">
            + Nueva Actividad
        </button>
    </header>

    <div class="lista-elementos">
        @if (actividades().length === 0) {
        <p class="sin-registros">No hay actividades registradas para este proceso.</p>
        } @else {
        @for (actividad of actividades(); track actividad.id) {
        <div class="tarjeta-elemento">
            <div class="info">
                <h3>{{ actividad.nombre }}</h3>
                <p><strong>Tipo:</strong> {{ actividad.tipo || 'N/A' }}</p>
                <p>{{ actividad.descripcion }}</p>
            </div>

            <div class="acciones">
                <button class="boton boton--secundario" (click)="irAEditar(actividad.id)">
                    Editar
                </button>
                <button class="boton boton--peligro" (click)="eliminar(actividad.id)">
                    Eliminar
                </button>
            </div>
        </div>
        }
        }
    </div>

    <div class="footer-acciones">
        <a class="boton boton--regresar" [routerLink]="['/procesos', procesoId]">Volver al Proceso</a>
    </div>
</div>
