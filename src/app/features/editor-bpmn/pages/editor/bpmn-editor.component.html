<div class="editor-container">
  <div class="toolbar">
    @if (puedeEditar) {
      <button type="button" class="btn" (click)="guardar()" [disabled]="guardando || cargando">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>
      <button type="button" class="btn" (click)="deshacer()" [disabled]="!puedeDeshacer()">
        Deshacer
      </button>
      <button type="button" class="btn" (click)="rehacer()" [disabled]="!puedeRehacer()">
        Rehacer
      </button>
      <button type="button" class="btn" (click)="eliminarSeleccion()">
        Eliminar
      </button>
    } @else {
      <span class="solo-lectura">Modo de solo lectura</span>
    }
    <button type="button" class="btn" (click)="zoomIn()">+</button>
    <button type="button" class="btn" (click)="zoomOut()">-</button>
    <a class="btn" [routerLink]="['/procesos', procesoId]">Volver</a>
    <span class="mensaje" *ngIf="mensaje">{{ mensaje }}</span>
  </div>

  @if (cargando) {
    <p class="estado">Cargando información del proceso…</p>
  }

  @if (error) {
    <p class="estado estado--error" role="alert">{{ error }}</p>
  }

  <div class="main-content" [class.main-content--oculto]="cargando || error">
    <div #canvasContainer class="canvas"></div>
    <aside class="inspector">
      <div #propertiesContainer class="properties-panel" [class.properties-panel--oculto]="soloLectura"></div>
      @if (procesoId) {
        <app-arco-panel [procesoId]="procesoId" [arcosDiagrama]="arcosDiagrama()" />
      }
    </aside>
  </div>
</div>
